[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-lens-ai"
version = "0.1.0"
description = "Local-first PII detection and redaction for AI datasets"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Ahmed Aladin" },
]
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
]

[project.optional-dependencies]
dev = [
  "pillow>=10.4,<13",
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
privacy-lens = "privacylens.cli:main"
privacy-lens-gate = "privacylens.gate:main"

[project.urls]
Repository = "https://github.com/ahmadaladin/privacy-lens-ai"
Issues = "https://github.com/ahmadaladin/privacy-lens-ai/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
